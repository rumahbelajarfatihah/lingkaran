function chrome(){$('#app').style.setProperty('--ac',COL[S.m]);$('#tabs').innerHTML=MOD.map((n,i)=>`<button class="tab ${i==S.m?'on':''}" role="tab" data-a="tab" data-v="${i}">M${i+1} ${n}</button>`).join('');

function mod(i){clearInterval(CT);S.cons=false;S.m3=false;S.m=i;S.cnt=0;S.t=1;S.play=false;$('#L').innerHTML=M[i].L();chrome();draw()}

const DUR=3500;let last=0;
function loop(ts){if(S.play){const dt=Math.min(60,ts-last);S.t+=dt/DUR*S.spd;if(S.t>=1){if($('#lp').checked)S.t=0;else{S.t=1;S.play=false}}draw()}last=ts;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const act={m3:()=>{S.m3=!S.m3;if(S.m3)S.cons=false;$('#L').innerHTML=M[2].L();touch();draw()},cons:()=>{clearInterval(CT);S.cons=!S.cons;if(S.cons)S.m3=false;S.cs=0;$('#L').innerHTML=M[2].L();touch();draw()},
cp:()=>{clearInterval(CT);S.cs=Math.max(0,S.cs-1);$('#L').innerHTML=M[2].L();draw()},cn:()=>{clearInterval(CT);S.cs++;$('#L').innerHTML=M[2].L();touch();draw();$('#L').innerHTML=M[2].L()},
ca:()=>{clearInterval(CT);S.cs=0;$('#L').innerHTML=M[2].L();draw();const n=consBuild(S.at).length;CT=setInterval(()=>{if(S.cs>=n-1){clearInterval(CT);return}S.cs++;$('#L').innerHTML=M[2].L();draw()},2200)},
at:v=>{S.cs=0;clearInterval(CT);S.at=v;$('#L').innerHTML=M[2].L();touch();draw()},tab:v=>mod(+v),sel:v=>{S.sel=v;$('#L').innerHTML=M[0].L();touch();draw()},
z:v=>{zoom(+v?+v:1/cam.k,300,260)},fit:()=>{cam.k=1;cam.tx=0;cam.ty=0;draw()},tool:v=>{S.tool=v;chrome()},
run:()=>{if(S.m==2&&!S.m3&&!S.cons){S.m3=true;$('#L').innerHTML=M[2].L()}if(RM){S.t=1;draw()}else{S.t=0;S.play=true}S.cnt+=3;chrome()},pp:()=>{if(S.t>=1)S.t=0;S.play=!S.play;draw()},st:v=>{S.play=false;S.t=cl(S.t+ +v,0,1);draw()},jb:()=>{S.jb=S.jb>=4?1:S.jb+1;if(S.jb==1)S.jb=1;draw()},
sA:()=>{const p=piOf(S.r2);S.sA={r:S.r2,K:H.keliling(S.r2,p),L:H.luas(S.r2,p)};touch();draw()},sB:()=>{const p=piOf(S.r2);S.sB={r:S.r2,K:H.keliling(S.r2,p),L:H.luas(S.r2,p)};touch();draw()},
chk2:()=>toast(Math.abs($('#cq').value-7)<.1?'Benar! r = 7 cm':'Belum tepat. Gunakan L = πr².'),chk4:()=>toast(Math.abs($('#cq').value-90)<1?'Benar! α = 90°':'Belum tepat. Busur = (α/360)·2πr.'),
a90:()=>{S.al=90;$('#L').innerHTML=M[3].L();touch();draw()},rec:()=>{if(S.cur3){S.hist.push(S.cur3);touch();draw()}},tebak:()=>{S.hist.push(S.cur3);toast('Tebakan: ∠APB = ½ ∠AOB = '+f(S.cur3[0],1)+'°');touch();draw()},
md:v=>{S.mode=v;$('#L').innerHTML=M[4].L();touch();draw()},cmp:()=>{toast('GSPD selalu lebih pendek dari GSPL pada d, r₁, r₂ yang sama');touch()},sc:v=>{S.sc=v;S.t=1;$('#L').innerHTML=M[5].L();draw()},
log:()=>{if(S.c){S.jur.push('M'+(S.m+1)+': '+S.c);S.cnt+=12;chrome();toast('Tercatat ('+S.jur.length+')')}},
copy:()=>{const t=S.jur.join('\n')||'(jurnal kosong)';try{navigator.clipboard.writeText(t).then(()=>toast('Jurnal disalin'),()=>fb(t))}catch(e){fb(t)}},
reset:()=>{Object.assign(S,{hist:[],sA:null,sB:null});cam.k=1;cam.tx=0;cam.ty=0;mod(S.m)}};
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Jurnal disalin')}catch(e){toast('Gagal menyalin')}a.remove()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='scr'){S.play=false;S.t=+t.value;draw();return}if(t.id=='spd'){S.spd=+t.value;return}if(t.dataset.f){const v=parseFloat(t.value);if(!(v>0))return;const F=t.dataset.f;let r;if(F=='r')r=v;else if(F=='d')r=v/2;else{const c7=F=='L'?Math.sqrt(v/(22/7)):v/(2*22/7),m7=Math.abs(c7/7-Math.round(c7/7))<.005&&c7>=1;r=(S.pi=='22/7'||(S.pi=='auto'&&m7))?(m7&&S.pi=='auto'?Math.round(c7/7)*7:c7):(F=='L'?Math.sqrt(v/3.14):v/6.28)}S.r2=cl(r,1,50);touch();draw();return}
const k=t.dataset.k;if(!k)return;
S[k]=t.type=='range'?+t.value:t.value;const v=$('#v_'+k);if(v)v.textContent=S[k];touch();draw()});
/* ===== zoom & pan ===== */
function zoom(m,mx,my){const k2=cl(cam.k*m,.4,6),r=k2/cam.k;cam.tx=mx-(mx-cam.tx)*r;cam.ty=my-(my-cam.ty)*r;cam.k=k2;draw()}
const V=$('#SV'),ptr=new Map();let dr=null,pan=null,pd=0;
V.addEventListener('wheel',e=>{e.preventDefault();const p=toV(e.clientX,e.clientY);zoom(Math.exp(-e.deltaY*.0015),p[0],p[1])},{passive:false});
const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
V.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);V.focus();const h=e.target.dataset&&e.target.dataset.h;
if(ptr.size==2){pd=dist();dr=null;pan=null}else if(h&&S.tool=='sel'){dr=h;e.preventDefault()}else pan={x:e.clientX,y:e.clientY,tx:cam.tx,ty:cam.ty};try{V.setPointerCapture(e.pointerId)}catch(x){}});
V.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);
if(ptr.size==2){const d=dist(),a=[...ptr.values()],p=toV((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);if(pd)zoom(d/pd,p[0],p[1]);pd=d;return}
if(dr){const q=toV(e.clientX,e.clientY),x=(q[0]-cam.tx)/cam.k,y=(q[1]-cam.ty)/cam.k;S[dr]=(deg(Math.atan2((S.dc||[CX,CY])[1]-y,x-(S.dc||[CX,CY])[0]))+360)%360;draw()}
else if(pan){const g=geom(),dx=(e.clientX-pan.x)/g.sc,dy=(e.clientY-pan.y)/g.sc;if(Math.hypot(dx,dy)>4/g.sc||pan.on){pan.on=1;cam.tx=pan.tx+dx;cam.ty=pan.ty+dy;draw()}}});
const up=e=>{ptr.delete(e.pointerId);pd=0;if(dr)touch();dr=null;pan=null};V.addEventListener('pointerup',up);V.addEventListener('pointercancel',up);
V.addEventListener('keydown',e=>{const k=e.key,s=30;if(k=='+'||k=='=')zoom(1.2,300,260);else if(k=='-')zoom(1/1.2,300,260);else if(k=='0'){cam.k=1;cam.tx=0;cam.ty=0;draw()}else if(k==' '){e.preventDefault();act.pp()}
else if(k=='ArrowLeft')cam.tx+=s;else if(k=='ArrowRight')cam.tx-=s;else if(k=='ArrowUp')cam.ty+=s;else if(k=='ArrowDown')cam.ty-=s;else return;draw()});
/* panel bisa diubah ukurannya: seret pemisah, panah keyboard, klik dua kali = reset, tombol Fokus = kanvas penuh */
(function(){const app=$('#app'),W={l:240,r:350},D0={l:240,r:350};let foc=false;
const sc=()=>app.getBoundingClientRect().width/1280;
function apply(){app.style.setProperty('--lw',W.l+'px');app.style.setProperty('--rw',W.r+'px');draw()}
const lim=(side,v)=>side=='l'?cl(v,120,520):cl(v,180,620);
function bind(id,side){const el=$(id);let sx=0,w0=0,on=false;
el.addEventListener('pointerdown',e=>{on=true;foc=false;sx=e.clientX;w0=W[side];try{el.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
el.addEventListener('pointermove',e=>{if(!on)return;const dx=(e.clientX-sx)/sc();W[side]=lim(side,side=='l'?w0+dx:w0-dx);apply()});
const end=()=>{on=false};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
el.addEventListener('dblclick',()=>{foc=false;W[side]=D0[side];apply()});
el.addEventListener('keydown',e=>{const d=e.key=='ArrowLeft'?-20:e.key=='ArrowRight'?20:0;if(!d)return;e.preventDefault();foc=false;W[side]=lim(side,side=='l'?W.l+d:W.r-d);apply()})}
bind('#s1','l');bind('#s2','r');
document.addEventListener('click',e=>{if(!e.target.closest('[data-a=foc]'))return;foc=!foc;if(foc){app.style.setProperty('--lw','0px');app.style.setProperty('--rw','0px');draw()}else apply()});
})();
fit();mod(0);
})();
